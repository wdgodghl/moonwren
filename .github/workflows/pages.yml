name: Playground Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.18+6c83a7f62
          core-version: 0.10.18+6c83a7f62
      - run: moon update
      - run: moon build --target js --release cmd/web_demo
      - name: Assemble static playground
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath _build/js -Recurse -File -Filter web_demo.js | Select-Object -First 1
          if (-not $artifact) { throw "MoonBit did not produce web_demo.js" }
          Copy-Item -LiteralPath $artifact.FullName -Destination web/moonwren.js -Force
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@v4
