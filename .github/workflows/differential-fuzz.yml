name: Differential Fuzzing

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: MoonWren branch, tag, or commit to test
        required: true
        default: "main"
        type: string
      cases:
        description: Generated cases per deterministic seed
        required: true
        default: "1000"
        type: string
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: differential-fuzz
  cancel-in-progress: false

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        seed: [20261025, 20261031, 20261101]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tested MoonWren source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: .candidate
      - name: Checkout official Wren CLI 0.4.0
        uses: actions/checkout@v4
        with:
          repository: wren-lang/wren-cli
          ref: 0.4.0
          path: .official-wren-cli
          submodules: recursive
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.18+6c83a7f62
          core-version: 0.10.18+6c83a7f62
      - name: Resolve tested MoonWren dependencies
        working-directory: .candidate
        run: moon update
      - name: Build tested MoonWren CLI
        working-directory: .candidate
        run: moon build --target native cmd/main
      - name: Apply upstream writeFn portability rename
        shell: pwsh
        run: |
          $path = ".official-wren-cli/src/cli/vm.c"
          $source = [IO.File]::ReadAllText($path)
          $source = $source.Replace("static void write(", "static void writeFn(")
          $source = $source.Replace("config.writeFn = write;", "config.writeFn = writeFn;")
          if (-not $source.Contains("static void writeFn(") -or
              -not $source.Contains("config.writeFn = writeFn;")) {
            throw "Could not apply the upstream writeFn portability rename."
          }
          [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))
      - name: Build official Wren CLI
        run: make -C .official-wren-cli/projects/make
      - name: Verify the reference executable
        shell: pwsh
        run: ./tools/verify-official-wren.ps1 -WrenExecutable .official-wren-cli/bin/wren_cli
      - name: Run deterministic differential cases
        shell: pwsh
        run: >-
          ./tools/fuzz-differential.ps1
          -OfficialWren .official-wren-cli/bin/wren_cli
          -MoonWren .candidate/_build/native/debug/build/cmd/main/main.exe
          -Cases ${{ inputs.cases || 1000 }}
          -Seed ${{ matrix.seed }}
          -MaxSeconds 900
          -CorpusDirectory .candidate/conformance/wren-0.4.0
      - name: Upload minimized mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-failure-${{ matrix.seed }}
          path: .tmp/fuzz-failures
          if-no-files-found: warn
          retention-days: 90
      - name: Upload deterministic run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-summary-${{ matrix.seed }}
          path: .tmp/fuzz-results
          if-no-files-found: error
          retention-days: 30
