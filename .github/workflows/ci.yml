name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.1.20260920
      - name: Check formatting
        run: moon fmt --check
      - name: Check packages
        run: moon check
      - name: Run tests
        run: moon test
