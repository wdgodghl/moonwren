name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Wren 0.4.0 reference suite
        uses: actions/checkout@v4
        with:
          repository: wren-lang/wren
          ref: 0.4.0
          path: .official-wren
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.18+6c83a7f62
          core-version: 0.10.18+6c83a7f62
      - name: Resolve dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check packages
        run: moon check --target all --deny-warn
      - name: Build packages
        run: moon build
      - name: Build native CLI
        run: moon build --target native
      - name: Build browser playground
        run: moon build --target js cmd/web_demo
      - name: Test browser and Node SDK
        shell: pwsh
        run: |
          ./tools/build-web-demo.ps1
          node web/sdk.test.mjs
      - name: Build performance benchmark
        run: moon build --target native --release cmd/benchmark
      - name: Run performance smoke gate
        shell: pwsh
        run: ./tools/check-performance.ps1 -SmokeOnly
      - name: Run tests
        run: moon test
      - name: Compare Wren 0.4.0 fixtures
        shell: pwsh
        run: ./tools/check-conformance.ps1
      - name: Run official Wren 0.4.0 language and core suite
        shell: pwsh
        run: ./tools/check-official-suite.ps1 -WrenRoot .official-wren
