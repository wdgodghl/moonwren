name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Resolve dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check packages
        run: moon check
      - name: Build packages
        run: moon build
      - name: Run tests
        run: moon test
      - name: Compare Wren 0.4.0 fixtures
        shell: pwsh
        run: ./tools/check-conformance.ps1
